<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>7월 FP LIVE</title>
<style>
:root{--paper:#EFE6D3;--ink:#34302A;--muted:#8B857A;--sage:#6E8CA0;--sage-d:#5F7D8E;--card:#fff;--good:#5E9A78}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:24px 20px 44px}
.top{font-size:15px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:16px}
h1{font-size:27px;line-height:1.42;margin-bottom:8px;word-break:keep-all}
.sub{font-size:16px;color:var(--muted);margin-bottom:20px}
textarea{width:100%;background:var(--card);border:3px solid var(--sage);border-radius:16px;padding:20px;font-size:22px;min-height:150px;box-shadow:0 4px 14px rgba(60,48,36,.08)}
input{width:100%;background:var(--card);border:none;border-radius:14px;padding:18px;font-size:18px;margin-top:12px;box-shadow:0 4px 14px rgba(60,48,36,.08)}
.opt{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:20px 16px;font-size:19px;line-height:1.4;margin-bottom:12px;box-shadow:0 4px 14px rgba(60,48,36,.07);border:3px solid transparent;word-break:keep-all}
.opt .n{flex:none;width:38px;height:38px;border-radius:50%;background:#DCE8ED;color:var(--sage-d);font-weight:800;display:grid;place-items:center;font-size:18px}
.opt.sel{border-color:var(--sage);background:#F4F8FA}
.opt.sel .n{background:var(--sage);color:#fff}
.opt.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.wbtn{border-radius:18px;padding:24px 18px;font-size:22px;font-weight:800;margin-bottom:14px;text-align:center;
  box-shadow:0 4px 14px rgba(60,48,36,.12);word-break:keep-all;transition:transform .12s}
.wbtn:active{transform:scale(.95)}
button{width:100%;margin-top:18px;background:var(--sage);color:#fff;border:none;border-radius:999px;padding:20px;font-size:22px;font-weight:800;position:sticky;bottom:14px;z-index:5;box-shadow:0 8px 22px rgba(60,48,36,.28)}
button:disabled{opacity:.45}
.wait{text-align:center;padding-top:24vh}
.wait .big{font-size:36px;font-weight:800;margin-bottom:20px}
.wait p{font-size:20px;line-height:1.75;color:var(--muted);word-break:keep-all}
.wait p b{color:var(--ink)}
.cnt{text-align:right;font-size:14px;color:var(--muted);margin-top:8px}
</style></head><body>
<div class="top">7월 FP LIVE</div>
<div id="app" class="wait"><div class="big">👋 환영합니다!</div><p>잘 들어오셨습니다.<br><b>잠시, 진행을 기다려주세요.</b></p></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ★ Firebase 설정 — 빌드 시 자동 주입 */
var CFG={apiKey:'AIzaSyDPSVu5cSoPG_1JmCkfP9TXfnRevTLn9WI',projectId:'fp-live-11cc5'};

firebase.initializeApp(CFG);
var db=firebase.firestore();
/* 방(room): 진행자가 나눠준 QR/링크의 ?room=<지점> 값. 없으면 기본 방. 방마다 완전히 분리됨. */
var ROOM=(new URLSearchParams(location.search).get('room')||'메인');
var RSTATE=db.doc('rooms/'+ROOM);          // 상태 문서(진행자가 여닫는 화면)
var RRESP=db.collection('rooms/'+ROOM+'/resp');  // 이 방의 답변
try{document.querySelector('.top').textContent='7월 FP LIVE · '+ROOM;}catch(e){}
var OPTS=["내 노후를 당겨쓴다","아내가 일을 내려놓는다","자녀의 미래를 희생한다","동생에게 2천만 원 여유가 있냐고 물어본다"];
var OPTS4=["암진단비","암진단및치료비","암복합생활비","비급여암복합생활비","간병인사용입원생활비"];
var WOPTS=["돈이 없어서","안 걸릴 것 같아서","나중에 하려고","고민만 하다가","보험이 싫어서","이미 있는 줄 알아서"];
var WCOL=[["#F4E3DD","#9C4A38"],["#DCE8ED","#40606F"],["#F7EFD8","#8A6F14"],["#E4EFE7","#3F6E52"],["#E9E2F0","#5B4A78"],["#EDE4CF","#7A6A4F"]];
var cur=null,excl=0,sel=-1,busy=false,lastSent={},reTimer=null;
var DEV=localStorage.getItem('fpdev');if(!DEV){DEV=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('fpdev',DEV);}

/* 실시간 리스너 — 진행자가 문항을 열면 즉시 화면 전환 */
RSTATE.onSnapshot(function(doc){
  var d=doc.exists?doc.data():{};
  var st=d.state||'idle', ex=Number(d.excl||0);
  if(st==='idle'){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('fp_')===0)localStorage.removeItem(k);});}catch(e){}lastSent={};}
  if(st!==cur||ex!==excl){cur=st;excl=ex;render();}
});

function el(h){var a=document.getElementById("app");a.className="";a.innerHTML=h;window.scrollTo(0,0);}
function wait(big,p){var a=document.getElementById("app");a.className="wait";a.innerHTML='<div class="big">'+big+'</div><p>'+p+'</p>';}
function did(k){return localStorage.getItem("fp_"+k);}
function cool(k){if(!lastSent[k])return false;var left=10000-(Date.now()-lastSent[k]);
  if(left<=0)return false;clearTimeout(reTimer);reTimer=setTimeout(render,left+200);return true;}
function mark(k){localStorage.setItem("fp_"+k,"1");}

function render(){sel=-1;
 if(cur==="qw"){if(cool("qw"))return wait("🎈 접수!","앞의 <b>큰 화면</b>에서<br>여러분의 답이 <b>부풀어 오릅니다</b><br><br>잠시 후, 다시 고를 수도 있어요<br>(마지막 선택만 반영됩니다)");
  el('<h1>고객들은 왜, 알면서<br>바로 가입하지 않을까?</h1><div class="sub">경험에서 나온 솔직한 답 하나 — 탭하면 바로 접수 · 익명</div>'+WOPTS.map(function(t,i){return '<div class="wbtn" style="background:'+WCOL[i][0]+';color:'+WCOL[i][1]+'" onclick="sendW('+i+')">'+t+'</div>';}).join(''));}
 else if(cur==="q0"){if(cool("q0"))return wait("✅ 접수 완료!","앞의 <b>큰 화면</b>을 봐주세요<br><br>잠시 후, 한 개 더 쓸 수 있어요");
  el('<h1>오늘 교육에서<br>바라는 점은?</h1><div class="sub">한 줄 · 익명 · 정답 없음</div><textarea id="t" maxlength="30"></textarea><div class="cnt"><span id="c">0</span>/30</div><button onclick="sendText(\'q0\')">보내기</button>');bindCnt();}
 else if(cur==="q1"){if(cool("q1"))return wait("✅ 접수 완료!","앞의 <b>큰 화면</b>을 봐주세요<br><br>잠시 후, 한 개 더 쓸 수 있어요");
  el('<h1>내일 내가 아프게 된다면,<br>절대 잃고 싶지 않은 것 하나.</h1><div class="sub">스무 글자 안쪽 · 익명 · 정답 없음</div><textarea id="t" maxlength="20"></textarea><div class="cnt"><span id="c">0</span>/20</div><button onclick="sendText(\'q1\')">보내기</button>');bindCnt();}
 else if(cur==="q2r1"){if(cool("q2r1"))return wait("🗳 투표 완료!","결과 공개를 기다려주세요.<br><br>잠시 후, 다시 고칠 수도 있어요<br>(마지막 선택만 반영됩니다)");
  el('<h1>여러분이 김 부장입니다.<br>어떤 기둥을 희생할까요?</h1><div class="sub">하나 선택 → 투표하기</div>'+opts([])+'<button onclick="sendVote(\'q2r1\')">투표하기</button>');}
 else if(cur==="q2r2"){if(cool("q2r2"))return wait("🗳 재투표 완료!","앞의 <b>큰 화면</b>을 봐주세요<br><br>잠시 후, 다시 고칠 수도 있어요");
  el('<h1>치료가 계속됩니다.<br>남은 보기에서 다시 고르세요</h1><div class="sub">아까 1위였던 보기는 사라졌습니다</div>'+opts([excl-1])+'<button onclick="sendVote(\'q2r2\')">재투표하기</button>');}
 else if(cur==="q4"){if(cool("q4"))return wait("🗳 투표 완료!","결과 공개를 기다려주세요.<br><br>잠시 후, 다시 고칠 수도 있어요<br>(마지막 선택만 반영됩니다)");
  el('<h1>만약 이분이 아직<br>암에 걸리지 않았다면 —<br>어떤 보장을 권하시겠습니까?</h1><div class="sub">하나 선택 → 투표하기</div>'+opts([],OPTS4)+'<button onclick="sendVote(\'q4\')">투표하기</button>');}
 else if(cur==="q3"){if(cool("q3"))return wait("🙏 소감 감사합니다!","여러분의 문장이<br>곧 <b>큰 화면</b>에 올라갑니다<br><br>잠시 후, 한 줄 더 쓸 수 있어요");
  el('<h1>오늘의 소감을 남겨주세요</h1><div class="sub">한글 30자 이내 · 익명 — 큰 화면에 흐릅니다</div><textarea id="t" maxlength="30"></textarea><div class="cnt"><span id="c">0</span>/30</div><button onclick="sendText(\'q3\')">남기기</button>');bindCnt();}
 else if(cur==="q3closed"){wait("👏 오늘 고생 많으셨습니다","<b>가서, 물어보세요.</b>");}
 else{if(localStorage.getItem("fp_done")||/closed$/.test(cur||""))wait("🎓 강의 중입니다","지금은 강의가 진행 중입니다.<br><b>앞의 강의 화면을 봐주세요.</b><br><br>다음 참여 순서가 되면<br>이 화면이 <b>저절로 바뀝니다.</b>");
  else wait("👋 환영합니다!","잘 들어오셨습니다.<br>교육이 시작되면 이 화면이<br><b>저절로 바뀝니다.</b><br><br>화면을 끄지 말고<br>잠시, 진행을 기다려주세요.");}}

function opts(gone,list){return (list||OPTS).map(function(t,i){var g=gone.indexOf(i)>-1;
  return '<div class="opt'+(g?" gone":"")+'" onclick="pick(this,'+i+')"><span class="n">'+(i+1)+'</span><span>'+t+'</span></div>';}).join("");}
function pick(e,i){sel=i;document.querySelectorAll(".opt").forEach(function(o){o.classList.remove("sel")});e.classList.add("sel");}
function bindCnt(){var t=document.getElementById("t");t.addEventListener("input",function(){document.getElementById("c").textContent=t.value.length;});}

function save(ph,v,r,ok,fail){RRESP.add({ph:ph,v:v,r:r||'',d:DEV,t:Date.now()}).then(function(){try{localStorage.setItem('fp_done','1')}catch(e){}ok();}).catch(fail);}
function sendText(ph){if(busy)return;var v=document.getElementById("t").value.trim();if(!v)return alert("한 줄만 적어주세요");
  if(!confirm('이대로 보낼까요?\n\n「 '+v+' 」'))return;busy=true;
  save(ph,v,"",function(){busy=false;lastSent[ph]=Date.now();render();},function(){busy=false;alert("전송 실패 — 한 번만 다시 눌러주세요");});}
function sendW(i){if(busy)return;busy=true;
  save("qw",WOPTS[i],"",function(){busy=false;lastSent.qw=Date.now();render();},function(){busy=false;alert("전송 실패 — 한 번만 다시 눌러주세요");});}
function sendVote(ph){if(busy)return;if(sel<0)return alert("보기를 먼저 선택해주세요");
  var list=ph==="q4"?OPTS4:OPTS;
  if(!confirm('『 '+list[sel]+' 』\n\n이대로 투표할까요?'))return;busy=true;
  var rs=document.getElementById("r")?document.getElementById("r").value:"";
  save(ph,list[sel],rs,function(){busy=false;lastSent[ph]=Date.now();render();},function(){busy=false;alert("전송 실패 — 한 번만 다시 눌러주세요");});}
</script></body></html>
